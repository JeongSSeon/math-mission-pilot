<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>수상한 초대장</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#17100b;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.app{max-width:560px;margin:auto}.screen{display:none;position:relative}.screen.active{display:block}.screen img{display:block;width:100%;height:auto}
.hot{position:absolute;border:0;background:transparent;z-index:5;cursor:pointer}
#start{left:30%;top:75%;width:41%;height:10%}#ready{left:29%;top:84.5%;width:43%;height:10%}#next{left:33%;top:79%;width:35%;height:10%}
#answer{left:33%;top:63%;width:35%;height:8%}#hint{left:33%;top:72%;width:35%;height:8%}
#hintText{display:none;position:absolute;left:18%;top:80.5%;width:64%;text-align:center;font-size:clamp(13px,3.2vw,18px);line-height:1.6;color:#21170f}
#hintText.show{display:block;animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.overlay{display:none;position:fixed;inset:0;z-index:50;background:#0009;align-items:center;justify-content:center;padding:22px}.overlay.show{display:flex}
.popup{width:min(88vw,380px);background:#f3e2bd;border-radius:15px;padding:30px 26px;text-align:center;position:relative;box-shadow:0 14px 40px #0007}
.popup h2{margin:0 0 18px;font-family:serif}.close{position:absolute;right:12px;top:8px;border:0;background:none;font-size:28px}
input{width:100%;height:52px;text-align:center;font-size:21px;border:1px solid #806a54;border-radius:8px}.ok{margin-top:14px;height:48px;width:145px;border:0;border-radius:7px;background:#3e281b;color:white;font-size:18px;font-weight:bold}
.err{height:24px;margin-top:9px;color:#a12820;font-weight:bold;font-size:14px}
.done{min-height:100vh;background:#d5ba83;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
</style></head><body><div class="app">
<section class="screen active" id="s1"><img src="screen1.png"><button class="hot" id="start" onclick="go('s2')"></button></section>
<section class="screen" id="s2"><img src="screen2.png"><button class="hot" id="ready" onclick="go('s3')"></button></section>
<section class="screen" id="s3"><img src="screen3.png"><button class="hot" id="next" onclick="go('s4')"></button></section>
<section class="screen" id="s4"><img src="screen4.png"><button class="hot" id="answer" onclick="openAnswer()"></button><button class="hot" id="hint" onclick="toggleHint()"></button>
<div id="hintText">앞의 수에 2를 곱하면<br>그 다음 숫자가 나온다.<br>그럼 ?에는 어떤 숫자가..?</div></section>
<section class="screen" id="s5"><div class="done"><div><h2>첫 번째 기록 해독 완료</h2><p>파일럿 테스트는 여기까지입니다.</p></div></div></section>
</div>
<div class="overlay" id="answerOverlay"><div class="popup"><button class="close" onclick="closeAnswer()">×</button><h2>정답 입력</h2>
<input id="answerInput" inputmode="numeric" placeholder="숫자를 입력하세요"><div class="err" id="err"></div><button class="ok" onclick="checkAnswer()">확인</button></div></div>
<script>
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function toggleHint(){document.getElementById('hintText').classList.toggle('show')}
function openAnswer(){document.getElementById('answerOverlay').classList.add('show');answerInput.value='';err.textContent='';setTimeout(()=>answerInput.focus(),100)}
function closeAnswer(){answerOverlay.classList.remove('show')}
function checkAnswer(){if(answerInput.value.trim()==='48'){closeAnswer();go('s5')}else err.textContent='틀렸습니다. 다시 풀어보세요!'}
answerInput.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});answerOverlay.addEventListener('click',e=>{if(e.target===answerOverlay)closeAnswer()})
</script></body></html>
